actor: Tester
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
bootstrap: _bootstrap.php
params:
    - tests/.env
modules:
    config:
        \craft\test\Craft:
            configFile: 'tests/_craft/config/test.php'
            entryUrl: 'https://dogear.test/index.php'
            projectConfig:
                folder: 'tests/_craft/project-seed'
                reset: true
            migrations: []
            plugins:
                - class: '\nineteenninetyfour\cookieconnect\Plugin'
                  handle: cookie-connect
            cleanup: true
            transaction: true
            dbSetup:
                clean: true
                setupCraft: true
